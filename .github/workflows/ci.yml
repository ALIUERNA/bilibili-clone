name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------- 前端：装依赖 → 代码检查 → 单元测试 → 打包 ----------
  frontend:
    name: 前端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --include=dev

      - name: 代码检查 (ESLint)
        run: npm run lint

      - name: 单元测试 (Vitest)
        run: npm run test:run

      - name: 打包
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ---------- 后端：编译 → 测试 → 打包 ----------
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 编译并打包
        run: mvn -B package -DskipTests

      - name: 上传 jar
        uses: actions/upload-artifact@v4
        with:
          name: bili-web-jar
          path: backend/target/bili-web.jar
          retention-days: 7

  # ---------- 前后端合体：验证能打成一个可运行的 jar ----------
  package:
    name: 合并打包（jar 内含前端）
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci --include=dev
          npm run build

      - name: 把前端产物放进后端静态目录
        run: |
          rm -rf backend/src/main/resources/static
          mkdir -p backend/src/main/resources/static
          cp -r frontend/dist/* backend/src/main/resources/static/

      - name: 打包成可执行 jar
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: 冒烟测试（启动服务并请求接口）
        run: |
          java -jar backend/target/bili-web.jar &
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf http://localhost:8080/api/home > /dev/null; then
              echo "✅ 服务启动成功"
              curl -s http://localhost:8080/api/home | head -c 200
              exit 0
            fi
          done
          echo "❌ 服务启动失败"
          exit 1

      - name: 上传可运行 jar
        uses: actions/upload-artifact@v4
        with:
          name: bili-web-runnable
          path: backend/target/bili-web.jar
          retention-days: 14
