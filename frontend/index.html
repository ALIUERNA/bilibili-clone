<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 让老版本 Edge / IE 用最新的渲染内核，避免布局错乱 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#6e56f8" />
    <meta name="description" content="a哩a哩：视频播放、弹幕、分区、登录（图形验证码 / 邮箱验证码 / 二维码）" />
    <!-- 站点图标就是品牌标志本身：圆角屏幕 + 播放三角 + 两道弹幕 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%237c5cff'/%3E%3Cstop offset='52%25' stop-color='%239b6bf5'/%3E%3Cstop offset='100%25' stop-color='%23ff7a45'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9.5' fill='url(%23g)'/%3E%3Crect x='5.4' y='6.4' width='9.4' height='2.5' rx='1.25' fill='%23fff' opacity='.92'/%3E%3Crect x='18.6' y='23.1' width='8' height='2.5' rx='1.25' fill='%23fff' opacity='.5'/%3E%3Cpath d='M13.4 12.2 L21.2 16.2 L13.4 20.2 Z' fill='%23fff' stroke='%23fff' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>a哩a哩 (゜-゜)つロ 干杯~</title>
    <style>
      /* 首屏骨架：JS 加载完成前也不会出现纯白页面。
         颜色写死在这里是有意的——此时 tokens.css 还没加载，不能引用 CSS 变量。 */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f7f8fa;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #8a9099;
        z-index: 1;
      }
      #app-loading .logo {
        width: 64px;
        height: 64px;
        border-radius: 19px;
        background: linear-gradient(120deg, #7c5cff 0%, #9b6bf5 48%, #ff7a45 100%);
        box-shadow: 0 10px 28px rgba(110, 86, 248, 0.32);
        animation: loading-breathe 1.9s ease-in-out infinite;
      }
      #app-loading .logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #app-loading .bar {
        width: 180px;
        height: 4px;
        border-radius: 999px;
        background: #e9ebef;
        overflow: hidden;
      }
      #app-loading .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(120deg, #7c5cff, #ff7a45);
        animation: loading-slide 1.1s ease-in-out infinite;
      }
      @keyframes loading-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @keyframes loading-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(0.93);
        }
      }
      /* 用户开了「减少动态效果」就别晃了 */
      @media (prefers-reduced-motion: reduce) {
        #app-loading .logo,
        #app-loading .bar i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="logo">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect x="5.4" y="6.4" width="9.4" height="2.5" rx="1.25" fill="#fff" opacity=".92" />
            <rect x="18.6" y="23.1" width="8" height="2.5" rx="1.25" fill="#fff" opacity=".5" />
            <path
              d="M13.4 12.2 L21.2 16.2 L13.4 20.2 Z"
              fill="#fff"
              stroke="#fff"
              stroke-width="2.8"
              stroke-linejoin="round"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <div class="bar"><i></i></div>
        <div>正在加载a哩a哩…</div>
      </div>
    </div>
    <noscript>
      <div style="padding: 24px; text-align: center; font: 14px/1.8 sans-serif">
        本站需要开启 JavaScript 才能正常浏览，请在浏览器设置中开启后刷新页面。
      </div>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
