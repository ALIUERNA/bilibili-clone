# 一条命令跑起来：docker compose up -d
# 然后浏览器打开 http://localhost:8080

services:
  bili-web:
    build: .
    image: bili-web:latest
    container_name: bili-web
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms128m -Xmx512m -Dfile.encoding=UTF-8"
    volumes:
      # 保存用户资料 / 上传的头像，容器删了也不会丢
      - bili-uploads:/app/uploads
    restart: unless-stopped

volumes:
  bili-uploads:
